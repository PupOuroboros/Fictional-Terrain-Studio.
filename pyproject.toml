[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fictional-terrain-studio"
version = "0.17.0"
description = "Open-source semantic terrain authoring toolkit for Cities: Skylines II"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Fictional Terrain Studio"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "Pillow>=11",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
agent = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=2,<3"]
ai = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=2,<3"]
hydrology = ["pyflwdir>=0.5"]
gis = ["rasterio>=1.4", "pyproj>=3.6"]
future = [
  "rasterio>=1.4",
  "pyproj>=3.6",
  "pyflwdir>=0.5",
  "landlab>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2,<3",
  "pyside6>=6.8",
  "pyinstaller>=6.10",
]

[project.scripts]
fts = "fictional_terrain_studio.cli:main"
fts-gui = "fictional_terrain_studio.desktop:main"
fts-api = "fictional_terrain_studio.api:main"
fts-mcp = "fictional_terrain_studio.mcp_server:main"
fts-qwen = "fictional_terrain_studio.ollama_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
